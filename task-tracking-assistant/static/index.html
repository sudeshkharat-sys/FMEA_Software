<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141414'/%3E%3Ctext x='16' y='25' font-family='Impact,Arial Narrow,sans-serif' font-size='26' font-weight='900' text-anchor='middle' fill='%23e50914'%3ET%3C/text%3E%3C/svg%3E">
<script>
  // theme: saved choice, else system preference
  (function () { let t; try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t; })();
</script>
<style>
  /* Monochrome UI. Colour is reserved for member profiles (--m-bg / --m-deep set per member). */
  :root { --bg:#f6f6f7; --card:#ffffff; --raise:#fafafa; --line:#e6e6e9; --line2:#d4d4d9; --txt:#111113; --mut:#6b6b73; --faint:#9a9aa3;
          --ink:#111113; --on-ink:#ffffff; --fill:#ececef; --tint:100%; --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05); }
  :root[data-theme=dark] { --bg:#0a0a0b; --card:#131315; --raise:#18181b; --line:#25252a; --line2:#34343b; --txt:#f3f3f5; --mut:#9a9aa3; --faint:#6b6b73;
          --ink:#f3f3f5; --on-ink:#0a0a0b; --fill:#222226; --tint:16%; --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35); }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,"Segoe UI Variable","Segoe UI",Inter,system-ui,Roboto,sans-serif; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  button,select,input,textarea { font:inherit; color:var(--txt); } button { cursor:pointer; }
  h1,h2,h3 { letter-spacing:-.02em; }

  /* header */
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .logo, .wordmark { font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Franklin Gothic Medium","Arial Narrow",sans-serif; font-weight:900; text-transform:uppercase; color:#e50914; line-height:1; text-shadow:0 1px 0 rgba(0,0,0,.25); }
  .logo { font-size:28px; letter-spacing:.02em; margin-right:auto; }
  .wordmark { font-size:34px; letter-spacing:.02em; margin-bottom:18px; }
  .pill { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mut); }
  .pill select, .btn { border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:7px 11px; }
  .pill select { color:var(--txt); font-weight:500; max-width:190px; }
  .btn { font-weight:600; transition:background .12s, transform .05s, border-color .12s; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--fill); } .btn:active { transform:translateY(1px); }
  .btn.solid { background:var(--ink); color:var(--on-ink); border-color:var(--ink); } .btn.solid:hover { opacity:.88; background:var(--ink); }
  .btn.small { padding:5px 10px; font-size:12px; border-radius:8px; }
  .btn.danger:hover { border-color:var(--ink); }
  .btn:disabled { opacity:.5; cursor:default; }
  .menuwrap { position:relative; }
  .menu { position:absolute; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line2); border-radius:12px; box-shadow:var(--shadow); padding:6px; min-width:170px; z-index:30; display:none; }
  .menu.open { display:block; }
  .menu button { display:flex; width:100%; justify-content:space-between; gap:12px; border:0; background:transparent; padding:8px 10px; border-radius:8px; text-align:left; }
  .menu button:hover { background:var(--fill); } .menu button.on { font-weight:700; } .menu button.on::after { content:"✓"; }

  main { flex:1; overflow:auto; padding:28px 24px; max-width:1360px; width:100%; margin:0 auto; }
  #notice { display:none; margin:0 0 16px; padding:10px 14px; border-radius:10px; background:var(--fill); color:var(--mut); border:1px solid var(--line); font-size:13px; }
  .pagehead { display:flex; align-items:flex-end; gap:12px; margin-bottom:20px; flex-wrap:wrap; } .pagehead .grow { margin-right:auto; }
  .pagehead h2 { margin:0; font-size:26px; } .pagehead small { color:var(--mut); }

  /* KPI tiles */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .kpi b { display:block; font-size:30px; line-height:1.1; letter-spacing:-.03em; }
  .kpi span { color:var(--mut); font-size:12px; }

  /* member colour: pastel, Apple-style. Inline vars --m-bg / --m-deep per member. */
  .mtint { background:color-mix(in srgb, var(--m-bg) var(--tint), var(--card)); }
  .avatar { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--m-bg); color:#1b1b1f; font-weight:700; flex:none; font-size:14px; }
  .avatar.lg { width:56px; height:56px; font-size:19px; } .avatar.sm { width:22px; height:22px; font-size:10px; }

  /* member cards */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  .ecard { background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s; display:flex; flex-direction:column; }
  .ecard:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--line2); }
  .ecard .top { padding:18px; display:flex; align-items:center; gap:14px; }
  .ecard .top b { font-size:16px; letter-spacing:-.01em; display:block; } .ecard .top small { color:var(--mut); }
  .ecard .top .pct { margin-left:auto; font-size:22px; font-weight:700; letter-spacing:-.03em; }
  .ecard .body { padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .bar { height:7px; background:var(--fill); border-radius:8px; overflow:hidden; } .bar i { display:block; height:100%; border-radius:8px; transition:width .4s; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; background:var(--fill); color:var(--mut); white-space:nowrap; border:1px solid transparent; }
  .chip.ink { background:var(--ink); color:var(--on-ink); } .chip.line { background:transparent; border-color:var(--ink); color:var(--txt); }
  .sect { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin-bottom:4px; font-weight:600; }
  ul.plain { margin:0; padding-left:18px; } ul.plain li { margin:2px 0; } ul.bl li { font-weight:600; }
  .muted { color:var(--mut); }
  .ecard .foot { margin-top:auto; padding-top:4px; display:flex; justify-content:space-between; align-items:center; }

  ul.plain.tight li { margin:3px 0; } .more { color:var(--faint); font-size:12px; margin-top:2px; }
  .ecard.risk { border-color:var(--ink); }
  .riskdot { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; font-weight:700; background:#d92d20; color:#fff; margin-left:8px; vertical-align:middle; }
  .attn { background:var(--card); border:1px solid var(--line2); border-left:4px solid #d92d20; border-radius:16px; padding:14px 18px; margin-bottom:16px; }
  .attn ul { margin:6px 0 0; padding:0; list-style:none; } .attn li { padding:3px 0; cursor:pointer; } .attn li:hover b { text-decoration:underline; }
  .attn .tag { font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px; background:var(--fill); margin-right:8px; }
  .cardhint { color:var(--faint); font-size:12px; }
  .dl { position:relative; } .dl.empty input { color:transparent; } .dl.empty:focus-within input { color:inherit; }
  .dl.empty::after { content:"Add deadline"; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint); font-style:italic; pointer-events:none; }
  .dl.empty:focus-within::after { display:none; }
  .nodl { color:var(--faint); font-style:italic; }
  .dtask { padding:10px 0; border-bottom:1px solid var(--line); } .dtask:last-child { border-bottom:0; }
  .dtask .meta { color:var(--mut); font-size:12px; margin-top:2px; }
  .modal .mb.rich { white-space:normal; }

  /* sheet */
  .banner { background:var(--card); border-radius:20px; padding:20px 22px; display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap; border:1px solid var(--line); }
  .banner h2 { margin:0; font-size:24px; } .banner small { color:var(--mut); } .banner .grow { margin-right:auto; }
  .sheetwrap { background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:auto; }
  table { border-collapse:collapse; width:100%; min-width:1150px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); background:var(--raise); padding:11px 8px; position:sticky; top:0; z-index:1; white-space:nowrap; font-weight:600; border-bottom:1px solid var(--line); }
  .sheetwrap th:nth-child(2) { min-width:120px; } .sheetwrap th:nth-child(3) { min-width:150px; } .sheetwrap th:nth-child(4) { min-width:150px; } .sheetwrap th:nth-child(5) { min-width:170px; }
  td { border-top:1px solid var(--line); padding:0; vertical-align:middle; }
  tbody tr:first-child td { border-top:0; } tbody tr:hover td { background:var(--raise); }
  .ro { padding:9px 8px; }
  td input:not([type=range]), td select { width:100%; border:0; background:transparent; padding:10px 8px; border-radius:0; }
  td input:focus, td select:focus { outline:2px solid var(--ink); outline-offset:-2px; background:var(--card); border-radius:8px; }
  td select { font-weight:600; cursor:pointer; }
  select[data-f=status] { border-radius:20px; padding:5px 10px; margin:6px; width:calc(100% - 12px); border:1px solid var(--line2); }
  select[data-f=status][data-v="To Do"] { color:var(--mut); }
  select[data-f=status][data-v="In Progress"] { background:var(--fill); }
  select[data-f=status][data-v="Blocked"] { border:1.5px solid var(--ink); }
  select[data-f=status][data-v="Done"] { background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
  select[data-f=status] option { background:var(--card); color:var(--txt); }
  select[data-f=priority][data-v="Low"] { color:var(--mut); font-weight:500; } select[data-f=priority][data-v="High"] { font-weight:800; }
  tr.overdue input[type=date] { font-weight:800; text-decoration:underline; }
  .prog { display:flex; align-items:center; gap:8px; padding:8px; } .prog input[type=range] { flex:1; min-width:70px; padding:0; } .prog span { width:38px; text-align:right; font-weight:600; font-size:12px; color:var(--mut); }
  tr.add td { background:var(--raise); border-top:1px solid var(--line2); }
  tr.done td { opacity:.6; }
  .viewnote { background:var(--fill); border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin-bottom:12px; color:var(--mut); font-size:13px; }
  .viewnote .link { margin-left:8px; padding:0; }
  .hint { color:var(--faint); font-size:12px; margin:12px 4px; }
  .iconbtn { border:0; background:transparent; font-size:15px; padding:6px 8px; border-radius:8px; color:var(--mut); } .iconbtn:hover { background:var(--fill); color:var(--txt); }
  .empty { padding:40px; text-align:center; color:var(--mut); }
  .teamtable { min-width:0 !important; } .teamtable td { padding:12px 14px; }
  .addmember { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; padding:14px; background:var(--raise); border-top:1px solid var(--line); }
  .addmember input { border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:9px 12px; }

  /* tabs (Excel-style, bottom) */
  .tabs { display:flex; gap:2px; padding:0 20px; background:var(--card); border-top:1px solid var(--line); overflow-x:auto; }
  .tab { padding:12px 16px; cursor:pointer; white-space:nowrap; color:var(--mut); font-weight:600; border-top:2px solid transparent; margin-top:-1px; display:flex; align-items:center; gap:8px; }
  .tab:hover { color:var(--txt); } .tab.active { color:var(--txt); border-top-color:var(--ink); background:var(--raise); }
  #toast { position:fixed; right:20px; bottom:70px; background:var(--ink); color:var(--on-ink); padding:9px 16px; border-radius:10px; display:none; box-shadow:var(--shadow); font-weight:500; z-index:60; }

  /* modal */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center; padding:20px; z-index:50; backdrop-filter:blur(3px); }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:22px; width:100%; max-width:560px; box-shadow:0 30px 80px rgba(0,0,0,.35); overflow:hidden; }
  .modal .mh { padding:20px 22px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); }
  .modal .mh h3 { margin:0; font-size:18px; } .modal .mh small { color:var(--mut); display:block; }
  .modal .mb { padding:20px 22px; white-space:pre-wrap; line-height:1.7; max-height:55vh; overflow:auto; }
  .modal .mf { padding:14px 22px; display:flex; gap:8px; justify-content:flex-end; align-items:center; border-top:1px solid var(--line); background:var(--raise); }
  .modal .mf .note { margin-right:auto; color:var(--faint); font-size:12px; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line2); border-top-color:var(--ink); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* setup */
  .setup { position:fixed; inset:0; z-index:40; background:var(--bg); display:grid; place-items:center; padding:24px; overflow:auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px; width:100%; max-width:620px; box-shadow:var(--shadow); }
    .panel h1 { margin:0 0 6px; font-size:26px; } .panel p { margin:0 0 22px; color:var(--mut); }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; } .field label { font-size:12px; font-weight:600; color:var(--mut); }
  .field input, .row input { border:1px solid var(--line2); background:var(--card); border-radius:10px; padding:10px 12px; width:100%; }
  .field input:focus, .row input:focus, .addmember input:focus { outline:2px solid var(--ink); outline-offset:-1px; }
  .row { display:grid; grid-template-columns:1fr 1fr 34px; gap:8px; margin-bottom:8px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
  .actions .btn { padding:11px 18px; }
  .link { background:none; border:0; color:var(--txt); font-weight:600; padding:6px 0; text-decoration:underline; text-underline-offset:3px; }
  @media (max-width:640px){ .row,.two,.addmember { grid-template-columns:1fr; } main { padding:16px 12px; } header { padding:10px 12px; } }
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <div class="logo">TASKFLOW</div>
  <label class="pill">Team <select id="team"></select></label>
  <label class="pill">Viewing as <select id="user"></select></label>
  <div class="menuwrap">
    <button class="btn" id="transBtn">Translate: <span id="transLabel">English</span> ▾</button>
    <div class="menu" id="transMenu"></div>
  </div>
  <span id="reportBox" class="pill" style="display:none">
    <select id="period"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
    <button class="btn" id="download">Report ↓</button>
  </span>
  <button class="btn" id="newTeam" style="display:none">+ New team</button>
  <button class="btn" id="theme" title="Light / dark">◐</button>
</header>
<main id="main" style="display:none">
  <div id="notice"></div>
  <div id="view"></div>
</main>
<div class="tabs" id="tabs" style="display:none"></div>
<div id="setup"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cfg, me, team, tab = "overview";
let lang = "en";   // English is always the default; the Translate button changes it for this session
function setLang(l) { lang = l; $("#transLabel").textContent = cfg.languages[l]; document.querySelectorAll("#transMenu button").forEach(b => b.classList.toggle("on", b.dataset.l === l)); }

/* Apple-15-style faint colours, one per member (never white / black / gray). [pastel, deeper accent] */
const PALETTE = [["#f4cfd8","#c97a8e"],["#f3e7b1","#b89c2e"],["#d2e2cb","#6f9a63"],["#cbdeed","#5e8db7"],["#dcd4f0","#8a78c2"],
                 ["#f7d9c2","#cf9058"],["#c9ecdf","#5cae96"],["#ecd0ea","#b36fb0"],["#f6cdc5","#cc7566"],["#dfe6c2","#94a24f"]];
/* progress grade: 0% red -> 50% amber -> 100% green */
const grade = p => `hsl(${Math.round(Math.max(0, Math.min(100, p)) * 1.2)} 68% 44%)`;
const mstyle = id => { const [bg, deep] = PALETTE[(id - 1) % PALETTE.length]; return `--m-bg:${bg};--m-deep:${deep}`; };

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { ...opts, headers: { "Content-Type": "application/json", ...(me ? { "X-User-Id": me.id } : {}), ...(opts.headers || {}) } });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    toast(typeof d.detail === "string" ? d.detail : "Something went wrong");
    throw new Error(r.status);
  }
  return r.json();
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2400); }
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const avatar = (m, cls = "") => `<span class="avatar ${cls}" style="${mstyle(m.id)}">${esc(initials(m.name))}</span>`;

async function loadConfig() { cfg = await (await fetch("/api/config")).json(); }

async function init() {
  await loadConfig();
  $("#transMenu").innerHTML = Object.entries(cfg.languages).map(([k, v]) => `<button data-l="${k}">${v}</button>`).join("");
  setLang(lang);
  $("#transBtn").onclick = e => { e.stopPropagation(); $("#transMenu").classList.toggle("open"); };
  document.addEventListener("click", () => $("#transMenu").classList.remove("open"));
  document.querySelectorAll("#transMenu button").forEach(b => b.onclick = () => { setLang(b.dataset.l); render(); });
  $("#team").onchange = e => selectTeam(+e.target.value);
  $("#user").onchange = e => { me = team.members.find(u => u.id == e.target.value); localStorage.setItem("uid", me.id); tab = me.role === "manager" ? "overview" : String(me.id); render(); };
  $("#download").onclick = () => location.href = `/api/report?period=${$("#period").value}&user=${me.id}`;
  $("#newTeam").onclick = () => showSetup(false);
  $("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {} };
  if (!cfg.teams.length) return showSetup(true);
  const savedTeam = +localStorage.getItem("team");
  selectTeam((cfg.teams.find(t => t.id === savedTeam) || cfg.teams[0]).id, +localStorage.getItem("uid"));
}

function selectTeam(id, preferUser) {
  team = cfg.teams.find(t => t.id === id);
  localStorage.setItem("team", id);
  me = team.members.find(u => u.id === preferUser) || team.members.find(u => u.role === "manager") || team.members[0];
  localStorage.setItem("uid", me.id);
  $("#team").innerHTML = cfg.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  $("#team").value = id;
  $("#user").innerHTML = team.members.map(u => `<option value="${u.id}">${esc(u.name)}${u.position ? " · " + esc(u.position) : ""}${u.role === "manager" ? " (leader)" : ""}</option>`).join("");
  $("#user").value = me.id;
  $("#setup").innerHTML = ""; ["hdr", "main"].forEach(i => $("#" + i).style.display = ""); $("#tabs").style.display = "flex";
  if (!cfg.ai_enabled) { const n = $("#notice"); n.style.display = "block"; n.textContent = "AI is off (no LLM API key in .env): translation is disabled and summaries use a simple rule-based format."; }
  tab = me.role === "manager" ? "overview" : String(me.id);
  render();
}

/* ---------- team setup ---------- */
function showSetup(first) {
  const memberRow = () => `<div class="row"><input class="m-name" placeholder="Employee name"><input class="m-pos" placeholder="Position (e.g. Developer)"><button class="iconbtn" title="Remove" onclick="this.parentElement.remove()">✕</button></div>`;
  $("#setup").innerHTML = `<div class="setup"><div class="panel">
    <div class="wordmark">TASKFLOW</div>
    <h1>${first ? "Create your team" : "Create a new team"}</h1>
    <p>Add the team, its leader and the people who report to them. You can change members later.</p>
    <div class="field"><label>Team name</label><input id="s-team" placeholder="e.g. Traceability Team" autofocus></div>
    <div class="two">
      <div class="field"><label>Leader / Manager name</label><input id="s-lead" placeholder="e.g. Sudesh"></div>
      <div class="field"><label>Leader position</label><input id="s-leadpos" value="Team Lead"></div>
    </div>
    <div class="sect" style="margin-top:16px">Team members</div>
    <div id="s-members">${memberRow()}${memberRow()}${memberRow()}</div>
    <button class="link" id="s-more">+ Add another member</button>
    <div class="actions">
      <button class="btn solid" id="s-create">Create team</button>
      ${first ? `<button class="btn" id="s-sample">Try with sample data</button>` : `<button class="btn" id="s-cancel">Cancel</button>`}
    </div></div></div>`;
  $("#s-more").onclick = () => $("#s-members").insertAdjacentHTML("beforeend", memberRow());
  if ($("#s-cancel")) $("#s-cancel").onclick = () => $("#setup").innerHTML = "";
  if ($("#s-sample")) $("#s-sample").onclick = async () => { const r = await api("/sample-team", { method: "POST" }); await loadConfig(); selectTeam(r.team_id); };
  $("#s-create").onclick = async () => {
    const name = $("#s-team").value.trim(), lead = $("#s-lead").value.trim();
    if (!name || !lead) return toast("Team name and leader name are required");
    const members = [...document.querySelectorAll("#s-members .row")].map(r => ({ name: r.querySelector(".m-name").value.trim(), position: r.querySelector(".m-pos").value.trim() })).filter(m => m.name);
    const r = await api("/teams", { method: "POST", body: JSON.stringify({ name, leader_name: lead, leader_position: $("#s-leadpos").value.trim() || "Team Lead", members }) });
    await loadConfig(); selectTeam(r.team_id, r.leader_id); toast("Team created");
  };
}

/* ---------- summarize modal ---------- */
async function summarize(empId) {
  const person = empId ? team.members.find(u => u.id === empId) : null;
  const title = person ? person.name : team.name;
  const sub = person ? (person.position || "Team member") : "Whole team";
  const head = `<div class="mh">${person ? avatar(person) : ""}<div><h3>Summary · ${esc(title)}</h3><small>${esc(sub)} · ${cfg.languages[lang]}</small></div></div>`;
  const close = () => $("#modal").innerHTML = "";
  $("#modal").innerHTML = `<div class="overlay"><div class="modal">${head}<div class="mb"><span class="spin"></span>Summarizing…</div><div class="mf"><button class="btn" id="m-close">Close</button></div></div></div>`;
  $("#m-close").onclick = close; $(".overlay").onclick = e => { if (e.target.classList.contains("overlay")) close(); };
  try {
    const r = await api(`/summary?lang=${lang}${empId ? "&employee_id=" + empId : ""}`, { method: "POST" });
    const note = !r.ai ? "Rule-based summary (AI off or unavailable)" : "Written by AI from the current tasks";
    $("#modal").innerHTML = `<div class="overlay"><div class="modal">${head}<div class="mb">${esc(r.summary)}</div>
      <div class="mf"><span class="note">${note}</span><button class="btn" id="m-copy">Copy</button><button class="btn solid" id="m-close">Close</button></div></div></div>`;
    $("#m-close").onclick = close; $(".overlay").onclick = e => { if (e.target.classList.contains("overlay")) close(); };
    $("#m-copy").onclick = () => { navigator.clipboard?.writeText(r.summary); toast("Copied"); };
  } catch { close(); }
}

/* ---------- tabs & views ---------- */
function renderTabs() {
  const isM = me.role === "manager";
  const emps = team.members.filter(u => u.role === "employee" && (isM || u.id === me.id));
  const items = (isM ? [["overview", `Overview`]] : []).concat(emps.map(e => [String(e.id), `${avatar(e, "sm")} ${esc(e.name)}`]));
  if (isM) items.push(["team", `Team`]);
  $("#tabs").innerHTML = items.map(([id, label]) => `<div class="tab ${id === tab ? "active" : ""}" data-id="${id}">${label}</div>`).join("");
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { tab = t.dataset.id; render(); });
}

async function render() {
  const isM = me.role === "manager";
  $("#reportBox").style.display = isM ? "" : "none";
  $("#newTeam").style.display = isM ? "" : "none";
  renderTabs();
  $("#view").innerHTML = '<div class="empty"><span class="spin"></span>Loading…</div>';
  if (tab === "team" && isM) return renderTeam();
  if (tab === "overview" && isM) return renderOverview();
  renderSheet(+tab);
}

/* blocked, overdue or due within 2 days, across the team */
function attentionStrip(data) {
  const rows = data.flatMap(e => e.attention.map(a => ({ ...a, id: e.id, name: e.name })));
  if (!rows.length) return "";
  return `<div class="attn"><div class="sect">Needs attention (${rows.length})</div><ul>${rows.slice(0, 8).map(r =>
    `<li data-att="${r.id}"><span class="tag">${esc(r.reason)}</span><b>${esc(r.name)}</b> · ${esc(r.title)}</li>`).join("")}</ul>
    ${rows.length > 8 ? `<div class="more">+${rows.length - 8} more</div>` : ""}</div>`;
}

/* compact card: ongoing work first; blockers only while there is room */
function cardWork(e) {
  const MAX = 3, w = e.current_work, b = e.blockers;
  const shownW = w.slice(0, MAX), room = MAX - shownW.length;
  const shownB = room > 0 ? b.slice(0, Math.min(room, 1)) : [];
  const hidden = (w.length - shownW.length) + (b.length - shownB.length);
  return `<div><div class="sect">Ongoing</div>${shownW.length ? `<ul class="plain tight">${shownW.map(t => `<li>${esc(t.title)}</li>`).join("")}</ul>` : `<span class="muted">Nothing in progress</span>`}</div>
    ${shownB.length ? `<div><div class="sect">Blocker</div><ul class="plain bl tight">${shownB.map(t => `<li>${esc(t.title)}${t.blocker ? ": " + esc(t.blocker) : ""}</li>`).join("")}</ul></div>` : ""}
    ${hidden > 0 ? `<div class="more">+${hidden} more</div>` : ""}`;
}

/* full ongoing tasks + blockers for one person */
function personDetail(e) {
  const close = () => $("#modal").innerHTML = "";
  const meta = t => [t.progress + "%", t.deadline ? "due " + t.deadline : null, t.overdue ? "overdue" : null].filter(Boolean).join(" · ");
  $("#modal").innerHTML = `<div class="overlay"><div class="modal">
    <div class="mh">${avatar(e)}<div><h3>${esc(e.name)}</h3><small>${esc(e.position || "Team member")} · ${e.avg_progress}% average</small></div></div>
    <div class="mb rich">
      <div class="sect">Ongoing tasks (${e.current_work.length})</div>
      ${e.current_work.map(t => `<div class="dtask"><b>${esc(t.title)}</b><div class="meta">${meta(t)}</div></div>`).join("") || `<div class="muted">Nothing in progress</div>`}
      <div class="sect" style="margin-top:16px">Blockers (${e.blockers.length})</div>
      ${e.blockers.map(t => `<div class="dtask"><b>${esc(t.title)}</b>${t.blocker ? `<div class="meta">${esc(t.blocker)}</div>` : ""}</div>`).join("") || `<div class="muted">No blockers</div>`}
    </div>
    <div class="mf"><button class="btn" id="m-sum">✦ Summarize</button><button class="btn" id="m-close">Close</button><button class="btn solid" id="m-open">Open sheet →</button></div></div></div>`;
  $("#m-close").onclick = close; $(".overlay").onclick = ev => { if (ev.target.classList.contains("overlay")) close(); };
  $("#m-open").onclick = () => { close(); tab = String(e.id); render(); };
  $("#m-sum").onclick = () => { close(); summarize(e.id); };
}

async function renderOverview() {
  const data = await api(`/overview?lang=${lang}`);
  const sum = k => data.reduce((a, e) => a + e[k], 0);
  const kpi = (n, label) => `<div class="kpi"><b>${n}</b><span>${label}</span></div>`;
  const avg = data.length ? Math.round(data.reduce((a, e) => a + e.avg_progress, 0) / data.length) : 0;
  $("#view").innerHTML = `
    <div class="pagehead"><div class="grow"><h2>${esc(team.name)}</h2><small>Team overview · open a profile for details</small></div>
      <button class="btn solid" id="sumTeam">✦ Summarize team</button></div>
    <div class="kpis">${kpi(sum("total"), "Total tasks")}${kpi(sum("done"), "Done")}${kpi(sum("in_progress"), "In progress")}${kpi(sum("blocked"), "Blocked")}${kpi(sum("overdue"), "Overdue")}${kpi(avg + "%", "Average progress")}</div>
    ${attentionStrip(data)}
    ${data.length ? `<div class="cards">${data.map(e => `
      <div class="ecard ${e.overdue ? "risk" : ""}" data-id="${e.id}" style="${mstyle(e.id)}">
        <div class="top">${avatar(e, "lg")}<div><b>${esc(e.name)}${e.overdue ? `<span class="riskdot">${e.overdue} overdue</span>` : ""}</b><small>${esc(e.position || "Team member")}</small></div><span class="pct">${e.avg_progress}%</span></div>
        <div class="body">
          <div class="bar"><i style="width:${e.avg_progress}%;background:${grade(e.avg_progress)}"></i></div>
          <div class="chips"><span class="chip">${e.total} ${e.total === 1 ? "task" : "tasks"}</span><span class="chip">${e.done} done</span><span class="chip">${e.in_progress} in progress</span>
            ${e.blocked ? `<span class="chip line">${e.blocked} blocked</span>` : ""}${e.overdue ? `<span class="chip ink">${e.overdue} overdue</span>` : ""}</div>
          ${cardWork(e)}
          <div class="foot"><button class="btn small" data-sum="${e.id}">✦ Summarize</button><span class="cardhint">Click for details</span></div>
        </div>
      </div>`).join("")}</div>`
    : `<div class="sheetwrap"><div class="empty">No team members yet. Open the Team tab to add people.</div></div>`}`;
  $("#sumTeam").onclick = () => summarize(null);
  document.querySelectorAll("[data-att]").forEach(li => li.onclick = () => personDetail(data.find(e => e.id === +li.dataset.att)));
  document.querySelectorAll(".ecard").forEach(r => r.onclick = () => personDetail(data.find(e => e.id === +r.dataset.id)));
  document.querySelectorAll("[data-sum]").forEach(b => b.onclick = e => { e.stopPropagation(); summarize(+b.dataset.sum); });
}

async function renderTeam() {
  $("#view").innerHTML = `
    <div class="pagehead"><div class="grow"><h2>Team</h2><small>${esc(team.name)} · add or remove people. Removing someone also deletes their tasks.</small></div></div>
    <div class="sheetwrap"><table class="teamtable"><thead><tr><th>Name</th><th>Position</th><th>Role</th><th></th></tr></thead><tbody>
      ${team.members.map(m => `<tr><td class="ro"><span style="display:inline-flex;align-items:center;gap:10px">${avatar(m, "sm")}<b>${esc(m.name)}</b></span></td>
        <td class="ro">${esc(m.position)}</td><td class="ro"><span class="chip ${m.role === "manager" ? "ink" : ""}">${m.role === "manager" ? "Leader" : "Employee"}</span></td>
        <td class="ro" style="text-align:right">${m.role === "employee" ? `<button class="btn small danger" data-rm="${m.id}" data-name="${esc(m.name)}">Remove</button>` : ""}</td></tr>`).join("")}
    </tbody></table>
    <div class="addmember"><input id="am-name" placeholder="New member name"><input id="am-pos" placeholder="Position"><button class="btn solid" id="am-add">+ Add member</button></div></div>`;
  $("#am-add").onclick = async () => {
    const name = $("#am-name").value.trim(); if (!name) return toast("Enter a name");
    await api("/members", { method: "POST", body: JSON.stringify({ name, position: $("#am-pos").value.trim() }) });
    await loadConfig(); selectTeam(team.id, me.id); tab = "team"; render(); toast("Member added");
  };
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.name} and all their tasks?`)) return;
    await api(`/members/${b.dataset.rm}`, { method: "DELETE" });
    await loadConfig(); selectTeam(team.id, me.id); tab = "team"; render();
  });
}

async function renderSheet(empId) {
  const person = team.members.find(u => u.id === empId);
  if (!person) return;
  const tasks = await api(`/employees/${empId}/tasks?lang=${lang}`);
  const isM = me.role === "manager";
  const sel = (arr, v) => arr.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("");
  const open = tasks.filter(t => t.status !== "Done").length;
  $("#view").innerHTML = `
    <div class="banner" style="${mstyle(person.id)}">${avatar(person, "lg")}
      <div class="grow"><h2>${esc(person.name)}</h2><small>${esc(person.position || "Team member")} · ${open} open · ${tasks.length - open} done</small></div>
      <button class="btn solid" id="sumOne">✦ Summarize</button></div>
    ${lang !== "en" ? `<div class="viewnote">Translated view (${cfg.languages[lang]}). Anything you save is stored in English. <button class="link" id="backEn">Back to English</button></div>` : ""}
    <div class="sheetwrap"><table><thead><tr><th style="width:24%">Task</th><th>Priority</th><th>Deadline</th><th>Status</th><th>Progress</th><th style="width:20%">Blocker</th><th style="width:20%">Remarks</th>${isM ? "<th></th>" : ""}</tr></thead>
    <tbody>${tasks.map(t => `
      <tr data-id="${t.id}" class="${t.overdue ? "overdue" : ""} ${t.status === "Done" ? "done" : ""}">
        <td>${isM ? `<input data-f="title" value="${esc(t.title)}" title="${esc(t.title_orig)}">` : `<div class="ro" title="${esc(t.title_orig)}"><b>${esc(t.title)}</b></div>`}</td>
        <td>${isM ? `<select data-f="priority" data-v="${t.priority}">${sel(cfg.priorities, t.priority)}</select>` : `<div class="ro">${t.priority}</div>`}</td>
        <td>${isM ? `<div class="dl ${t.deadline ? "" : "empty"}"><input type="date" data-f="deadline" value="${t.deadline || ""}"></div>` : (t.deadline ? `<div class="ro">${t.deadline}</div>` : `<div class="ro nodl">No deadline</div>`)}</td>
        <td><select data-f="status" data-v="${t.status}">${sel(cfg.statuses, t.status)}</select></td>
        <td><div class="prog"><input type="range" min="0" max="100" step="5" data-f="progress" value="${t.progress}" style="accent-color:${grade(t.progress)}"><span>${t.progress}%</span></div></td>
        <td><input data-f="blocker" value="${esc(t.blocker)}" placeholder="Type in any language…" title="${esc(t.blocker_orig)}"></td>
        <td><input data-f="remarks" value="${esc(t.remarks)}" placeholder="Type in any language…" title="${esc(t.remarks_orig)}"></td>
        ${isM ? `<td class="ro"><button class="iconbtn" data-del title="Delete task">✕</button></td>` : ""}
      </tr>`).join("") || `<tr><td colspan="8" class="empty">No tasks yet${isM ? " — add the first one below" : ""}</td></tr>`}
    ${isM ? `<tr class="add">
        <td colspan="${8}"><div style="display:flex;gap:10px"><input id="nt-text" style="flex:1" placeholder="＋ Type a task in plain words, e.g. “Fix barcode bug by Friday” — AI fills in the name and deadline" title="English, हिंदी, मराठी or Hinglish. Add a person's name to assign it to them.">
        <button class="btn solid small" id="nt-add">Add task</button></div></td></tr>` : ""}
    </tbody></table></div>
    <p class="hint">Click any cell to edit — it saves automatically. Type in Hindi, Marathi, English or Hinglish. Spelling is corrected and it is always stored in English. Hover a cell to see what was originally typed. Use Translate (top) to read in another language.</p>`;

  $("#sumOne").onclick = () => summarize(empId);
  if ($("#backEn")) $("#backEn").onclick = () => { setLang("en"); render(); };
  document.querySelectorAll("tbody tr[data-id]").forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll("[data-f]").forEach(el => {
      const f = el.dataset.f;
      if (f === "progress") el.oninput = () => { el.nextElementSibling.textContent = el.value + "%"; el.style.accentColor = grade(+el.value); };
      el.onchange = async () => {
        let v = el.value; if (f === "progress") v = +v;
        toast("Saving…");
        const isText = ["title", "blocker", "remarks"].includes(f);
        try {
          const r = await api(`/tasks/${id}`, { method: "PATCH", body: JSON.stringify({ [f]: v }) });
          toast(isText ? (r.translated === false ? "Saved as typed — AI translation unavailable" : "Saved in English") : "Saved");
        } catch {}
        if (isText) setLang("en");
        if (["status", "title", "blocker", "remarks", "deadline"].includes(f)) render(); else if (el.dataset.v) el.dataset.v = v;
      };
    });
    const del = row.querySelector("[data-del]");
    if (del) del.onclick = async () => { if (confirm("Delete this task?")) { await api(`/tasks/${id}`, { method: "DELETE" }); render(); } };
  });
  const add = $("#nt-add");
  if (add) {
    const submit = async () => {
      const text = $("#nt-text").value.trim(); if (!text) return toast("Type a task");
      add.disabled = true; toast("Adding…");
      try {
        const r = await api("/tasks/quick", { method: "POST", body: JSON.stringify({ employee_id: empId, text }) });
        toast((r.employee_id !== empId ? `Added for ${team.members.find(m => m.id === r.employee_id)?.name} · ` : "Task added · ") + (r.deadline ? "due " + r.deadline : "no deadline yet"));
      } catch {}
      setLang("en");
      render();
    };
    add.onclick = submit;
    $("#nt-text").onkeydown = e => { if (e.key === "Enter") submit(); };
  }
}
init();
</script>
</body>
</html>
